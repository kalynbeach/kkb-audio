[package]
name = "kkb-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rubato = { version = "=5.0.0", default-features = false, features = ["fft_resampler"] }
audioadapter-buffers = "=5.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "=0.18.2"
rtrb = "=0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
